[project]
name = "letter-valence-research"
version = "0.1.0"
description = "Letter-derived feature sentiment analysis for financial news"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "shap>=0.45",
]

[tool.vercel]
entrypoint = "api.index:app"

[project.optional-dependencies]
full = [
    "shap>=0.45",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
